<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rádio Músicas Inesquecíveis</title>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff7700;
            margin-top: 20px;
            font-size: 28px;
        }

        .radio-box {
            max-width: 500px;
            margin: 30px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .imagem-radio {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .imagem-radio img {
            display: block;
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 8px;
        }

        /* Botão de play perfeitamente centralizado no círculo branco */
        #botao-play {
            position: absolute;
            top: 42.5%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 46px;
            height: 46px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0,0,0,0.8);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #botao-play:hover {
            background: rgba(255, 119, 0, 0.85);
            border-color: #ffffff;
            transform: translate(-50%, -50%) scale(1.08);
        }

        /* Miolo Vermelho pequeno pulsando no centro do alto-falante */
        .miolo-vermelho {
            position: absolute;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: rgba(255, 0, 51, 0.9);
            box-shadow: 0 0 12px #ff0033, 0 0 20px #ff3366;
            pointer-events: none;
            animation: bateMiolo 0.3s infinite alternate ease-in-out;
            z-index: 4;
        }

        /* Anel Azul grosso em volta (centro vazado) */
        .anel-azul {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 5px solid rgba(0, 204, 255, 0.85);
            background: transparent;
            box-shadow: 0 0 12px #00ccff, inset 0 0 10px rgba(0, 204, 255, 0.6);
            pointer-events: none;
            animation: bateAnel 0.3s infinite alternate-reverse ease-in-out;
            z-index: 3;
        }

        .pos-esq {
            top: 52%;
            left: 17%;
            transform: translate(-50%, -50%);
        }

        .pos-dir {
            top: 52%;
            left: 83%;
            transform: translate(-50%, -50%);
        }

        @keyframes bateMiolo {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
        }

        @keyframes bateAnel {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        /* Equalizador no visor superior */
        .ondas-visor {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 18px;
            pointer-events: none;
            z-index: 4;
        }

        .ondas-visor span {
            width: 3px;
            background: #00ffcc;
            border-radius: 2px;
            box-shadow: 0 0 5px #00ffcc;
            animation: balancaOnda 0.6s infinite ease-in-out;
        }

        .ondas-visor span:nth-child(2) { animation-duration: 0.4s; }
        .ondas-visor span:nth-child(3) { animation-duration: 0.7s; }
        .ondas-visor span:nth-child(4) { animation-duration: 0.5s; }
        .ondas-visor span:nth-child(5) { animation-duration: 0.8s; }

        @keyframes balancaOnda {
            0%, 100% { height: 3px; }
            50% { height: 15px; }
        }

        .instrucao {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 15px;
        }

        #status-radio {
            color: #ff7700;
            font-size: 14px;
            margin-top: 12px;
        }

        .tocando-agora {
            margin-top: 15px;
            padding: 10px;
            background: #282828;
            border-radius: 8px;
            border-left: 4px solid #ff7700;
        }

        .tocando-agora span {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #nome-musica {
            font-size: 15px;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>RÁDIO MÚSICAS INESQUECÍVEIS</h1>

    <div class="radio-box">

        <div class="imagem-radio">
            <img src="som.jpg"
                 alt="Aparelho de som da Rádio Músicas Inesquecíveis">

            <!-- Anéis azuis e miolos vermelhos pulsando em ambos os alto-falantes -->
            <div class="anel-azul pos-esq"></div>
            <div class="anel-azul pos-dir"></div>
            <div class="miolo-vermelho pos-esq"></div>
            <div class="miolo-vermelho pos-dir"></div>

            <!-- Equalizador animado no visor superior -->
            <div class="ondas-visor">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Botão de play centralizado no círculo branco -->
            <button id="botao-play"
                    type="button"
                    aria-label="Tocar rádio"
                    onclick="alternarRadio()">
                ▶️
            </button>
        </div>

        <p class="instrucao">
            Aperte o play para ouvir a transmissão ao vivo
        </p>

        <audio id="audio-radio" preload="none"></audio>

        <p id="status-radio">
            Rádio pronta para tocar
        </p>

        <div class="tocando-agora">
            <span>Tocando Agora</span>
            <div id="nome-musica">Aguardando conexão...</div>
        </div>

    </div>

    <script>
        const audio = document.getElementById("audio-radio");
        const botao = document.getElementById("botao-play");
        const status = document.getElementById("status-radio");
        const divMusica = document.getElementById("nome-musica");

        const enderecoRadio =
            "https://fpsnew2.listen2myradio.com:2199/listen.php?ip=212.84.160.3&port=6097&type=s1";

        function atualizarInfoMusica() {
            const urlAlvo = "http://212.84.160.3:6097/7.html";
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(urlAlvo)}`;

            fetch(proxyUrl, { cache: "no-store" })
                .then(resposta => resposta.json())
                .then(dados => {
                    if (dados && dados.contents) {
                        let parser = new DOMParser();
                        let htmlDoc = parser.parseFromString(dados.contents, 'text/html');
                        let textoPuro = htmlDoc.body.textContent || "";
                        
                        let partes = textoPuro.split(',');
                        if (partes.length >= 7) {
                            let musicaAtual = partes[6];
                            if (musicaAtual && musicaAtual.trim() !== "") {
                                divMusica.textContent = musicaAtual;
                            }
                        }
                    }
                })
                .catch(() => {});
        }

        async function alternarRadio() {
            if (!audio.paused) {
                audio.pause();
                botao.textContent = "▶️";
                status.textContent = "Rádio pausada";
                return;
            }

            if (!audio.src) {
                audio.src = enderecoRadio;
            }

            status.textContent = "Conectando à rádio...";

            try {
                await audio.play();
                botao.textContent = "Ⅱ";
                status.textContent = "Rádio ao vivo";
                atualizarInfoMusica();
            } catch (erro) {
                status.textContent =
                    "Não foi possível tocar. Vamos verificar a conexão.";
                console.error(erro);
            }
        }

        audio.addEventListener("playing", function() {
            botao.textContent = "Ⅱ";
            status.textContent = "Rádio ao vivo";
            atualizarInfoMusica();
            if (!window.intervaloMusica) {
                window.intervaloMusica = setInterval(atualizarInfoMusica, 15000);
            }
        });

        audio.addEventListener("pause", function() {
            botao.textContent = "▶️";
            if (window.intervaloMusica) {
                clearInterval(window.intervaloMusica);
                window.intervaloMusica = null;
            }
        });

        audio.addEventListener("error", function() {
            status.textContent =
                "Não foi possível carregar o áudio da rádio.";
        });
    </script>

</body>
</html>
