<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rádio Músicas Inesquecíveis</title>

    <style>
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff7700;
            margin-top: 15px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(255, 119, 0, 0.5);
        }

        .subtitulo-topo {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .radio-box {
            max-width: 520px;
            margin: 0 auto 20px auto;
            background: #141418;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            border: 1px solid #22222c;
        }

        .imagem-radio {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .imagem-radio img {
            display: block;
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 10px;
        }

        /* Botão de play sagrado e intocável no centro exato */
        #botao-play {
            position: absolute;
            top: 41%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.9), 0 0 10px rgba(255, 119, 0, 0.5);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }

        #botao-play:hover {
            background: rgba(255, 119, 0, 0.9);
            border-color: #ffffff;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* EFEITO NOS ALTO-FALANTES: Bloco 100% unido (Vermelho -> Amarelo -> Verde -> Azul) sem frestas */
        .bloco-luz-esq, .bloco-luz-dir {
            position: absolute;
            top: 52%;
            width: 86px;
            height: 86px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(255, 0, 51, 0.98) 0%, 
                rgba(255, 0, 51, 0.98) 30%, 
                rgba(255, 204, 0, 0.95) 30%, 
                rgba(255, 204, 0, 0.95) 55%, 
                rgba(0, 255, 128, 0.95) 55%, 
                rgba(0, 255, 128, 0.95) 75%, 
                rgba(0, 204, 255, 0.95) 75%, 
                rgba(0, 204, 255, 0.95) 100%
            );
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.8), inset 0 0 10px rgba(255, 0, 51, 0.8);
            pointer-events: none;
            animation: pulsarBloco 0.35s infinite alternate ease-in-out;
            z-index: 3;
        }

        .bloco-luz-esq { left: 17%; }
        .bloco-luz-dir { left: 83%; }

        @keyframes pulsarBloco {
            0% { transform: translate(-50%, -50%) scale(0.94); opacity: 0.85; }
            100% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }

        /* Equalizador no visor superior */
        .ondas-visor {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 18px;
            pointer-events: none;
            z-index: 7;
        }

        .ondas-visor span {
            width: 3px;
            background: #00ffcc;
            border-radius: 2px;
            box-shadow: 0 0 6px #00ffcc;
            animation: balancaOnda 0.6s infinite ease-in-out;
        }

        .ondas-visor span:nth-child(2) { animation-duration: 0.4s; }
        .ondas-visor span:nth-child(3) { animation-duration: 0.7s; }
        .ondas-visor span:nth-child(4) { animation-duration: 0.5s; }
        .ondas-visor span:nth-child(5) { animation-duration: 0.8s; }

        @keyframes balancaOnda {
            0%, 100% { height: 3px; }
            50% { height: 15px; }
        }

        .instrucao {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 15px;
        }

        #status-radio {
            color: #ff7700;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }

        .tocando-agora {
            margin-top: 15px;
            padding: 12px;
            background: #1b1b22;
            border-radius: 10px;
            border-left: 4px solid #ff7700;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .tocando-agora span {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        #nome-musica {
            font-size: 14px;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>RÁDIO MÚSICAS INESQUECÍVEIS</h1>
    <div class="subtitulo-topo">Sempre com o melhor da música!</div>

    <div class="radio-box">

        <div class="imagem-radio">
            <img src="som.jpg" alt="Aparelho de som da Rádio Músicas Inesquecíveis">

            <!-- Blocos de luz unificados nos alto-falantes (Esquerda e Direita) -->
            <div class="bloco-luz-esq"></div>
            <div class="bloco-luz-dir"></div>

            <!-- Equalizador animado no visor -->
            <div class="ondas-visor">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Botão de play sagrado -->
            <button id="botao-play"
                    type="button"
                    aria-label="Tocar rádio"
                    onclick="alternarRadio()">
                ▶️
            </button>
        </div>

        <p class="instrucao">
            Aperte o play para ouvir a transmissão ao vivo
        </p>

        <audio id="audio-radio" preload="none"></audio>

        <p id="status-radio">
            Rádio pronta para tocar
        </p>

        <div class="tocando-agora">
            <span>Tocando Agora</span>
            <div id="nome-musica">Aguardando conexão...</div>
        </div>

    </div>

    <script>
        const audio = document.getElementById("audio-radio");
        const botao = document.getElementById("botao-play");
        const status = document.getElementById("status-radio");
        const divMusica = document.getElementById("nome-musica");

        const enderecoRadio =
            "https://fpsnew2.listen2myradio.com:2199/listen.php?ip=212.84.160.3&port=6097&type=s1";

        function atualizarInfoMusica() {
            const urlAlvo = "http://212.84.160.3:6097/7.html";
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(urlAlvo)}`;

            fetch(proxyUrl, { cache: "no-store" })
                .then(resposta => resposta.json())
                .then(dados => {
                    if (dados && dados.contents) {
                        let parser = new DOMParser();
                        let htmlDoc = parser.parseFromString(dados.contents, 'text/html');
                        let textoPuro = htmlDoc.body.textContent || "";
                        
                        let partes = textoPuro.split(',');
                        if (partes.length >= 7) {
                            let musicaAtual = partes[6];
                            if (musicaAtual && musicaAtual.trim() !== "") {
                                divMusica.textContent = musicaAtual;
                            }
                        }
                    }
                })
                .catch(() => {});
        }

        async function alternarRadio() {
            if (!audio.paused) {
                audio.pause();
                botao.textContent = "▶️";
                status.textContent = "Rádio pausada";
                return;
            }

            if (!audio.src) {
                audio.src = enderecoRadio;
            }

            status.textContent = "Conectando à rádio...";

            try {
                await audio.play();
                botao.textContent = "Ⅱ";
                status.textContent = "Rádio ao vivo";
                atualizarInfoMusica();
            } catch (erro) {
                status.textContent =
                    "Não foi possível tocar. Vamos verificar a conexão.";
                console.error(erro);
            }
        }

        audio.addEventListener("playing", function() {
            botao.textContent = "Ⅱ";
            status.textContent = "Rádio ao vivo";
            atualizarInfoMusica();
            if (!window.intervaloMusica) {
                window.intervaloMusica = setInterval(atualizarInfoMusica, 15000);
            }
        });

        audio.addEventListener("pause", function() {
            botao.textContent = "▶️";
            if (window.intervaloMusica) {
                clearInterval(window.intervaloMusica);
                window.intervaloMusica = null;
            }
        });

        audio.addEventListener("error", function() {
            status.textContent =
                "Não foi possível carregar o áudio da rádio.";
        });
    </script>

</body>
</html>
