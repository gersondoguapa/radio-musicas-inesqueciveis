<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádio Músicas Inesquecíveis</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff7700;
            margin-top: 20px;
            font-size: 28px;
        }
        .radio-box {
            max-width: 500px;
            margin: 30px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .radio-box img {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        p.instrucao {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 15px;
        }
        audio {
            width: 100%;
            outline: none;
            margin-bottom: 15px;
        }
        .btn-ouvir {
            display: inline-block;
            background-color: #ff7700;
            color: #ffffff;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-top: 10px;
        }
        .btn-ouvir:hover {
            background-color: #e06600;
        }
    </style>
</head>
<body>

    <h1>RÁDIO MÚSICAS INESQUECÍVEIS</h1>

    <div class="radio-box">
        <!-- Imagem do seu aparelho de som -->
        <img src="som.jpg" alt="Aparelho de Som - Rádio Músicas Inesquecíveis">
        
        <p class="instrucao">Aperte o play abaixo para tocar a rádio:</p>
        
        <!-- Player com link direto otimizado para SHOUTcast -->
        <audio controls preload="none">
            <source src="http://212.84.160.3:6097/;" type="audio/mpeg">
            Seu navegador não suporta áudio HTML5.
        </audio>
        
        <br>
        
        <!-- Botão de emergência caso queira abrir direto no player do painel -->
        <a href="https://musicasinesqueciveis.listenmyshow.com" class="btn-ouvir" target="_blank">🎵 ABRIR PLAYER OFICIAL</a>
    </div>

</body>
</html>
