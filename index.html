<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádio Músicas Inesquecíveis</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff7700;
            margin-top: 20px;
            font-size: 28px;
        }
        .radio-box {
            max-width: 500px;
            margin: 30px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .radio-box img {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        p.instrucao {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <h1>RÁDIO MÚSICAS INESQUECÍVEIS</h1>

    <div class="radio-box">
        <!-- Imagem do seu aparelho de som -->
        <img src="som.jpg" alt="Aparelho de Som - Rádio Músicas Inesquecíveis">
        
        <p class="instrucao">Aperte o play abaixo para ouvir a transmissão ao vivo</p>
        
        <!-- Player oficial rodando direto do SHOUTcast -->
        <audio controls preload="none">
            <source src="http://212.84.160.3:6097/;stream.mp3" type="audio/mpeg">
            Seu navegador não suporta áudio HTML5.
        </audio>
    </div>

</body>
</html>
