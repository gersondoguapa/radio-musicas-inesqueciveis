<!-- TV Web CORRIGIDA - Formato HLS -->
<div class="tv-box">
    <h3>Web TV - Ao Vivo</h3>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <div class="video-container">
        <video id="player-tv" controls autoplay muted style="width:100%;height:100%;background:#000;">
            Seu navegador não suporta vídeo.
        </video>
    </div>
    <p id="status-tv" style="margin-top:10px;color:#ff7700;font-size:13px;">Conectando à TV ao vivo...</p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const video = document.getElementById('player-tv');
    const statusTv = document.getElementById('status-tv');
    const streamTv = 'https://live.iblups.com:1935/live/24d4fdd27e47957835ba2f809817625d/index.m3u8';

    if (Hls.isSupported()) {
        const hls = new Hls({
            maxBufferLength: 10,
            maxMaxBufferLength: 20
        });
        hls.loadSource(streamTv);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            statusTv.textContent = "✅ TV ao vivo — transmitindo";
            video.play().catch(() => {
                statusTv.textContent = "Clique no play para assistir";
            });
        });
        
        hls.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) {
                statusTv.textContent = "❌ Sinal fora do ar ou formato incompatível";
            }
        });
    }
    // Safari suporta HLS nativamente
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamTv;
        video.addEventListener('loadedmetadata', function() {
            statusTv.textContent = "✅ TV ao vivo — transmitindo";
            video.play();
        });
    }
});
</script>
